# Concern: the checks every push and pull request must clear | Non-concern: tagging and publishing a build (release.yml) | IO: (push, pull_request) -> a pass/fail verdict
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANNOTATED_TREE_VERSION: "0.7.0"
  COMMENT_CRUSHER_VERSION: "0.2.1"

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gates
          cache-bin: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-bin-${{ runner.os }}-annotated-tree-${{ env.ANNOTATED_TREE_VERSION }}-comment-crusher-${{ env.COMMENT_CRUSHER_VERSION }}
      - run: cargo install --locked annotated-tree@${{ env.ANNOTATED_TREE_VERSION }} comment-crusher@${{ env.COMMENT_CRUSHER_VERSION }}
      - run: ./.githooks/pre-commit

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "latest"
      - run: wasm-pack test --node crates/sva-wasm
      # The runner image's own chromedriver matches its Chrome; one wasm-pack downloads may not.
      - run: wasm-pack test --headless --chrome --chromedriver "$CHROMEWEBDRIVER/chromedriver" crates/sva-wasm --test opfs
