# Concern: declares the package, its binary target and the crates the CLI composes | Non-concern: the deny edges barring anything from depending on it (.annotated-tree.toml) | IO: none
[package]
name = "sva-cli"
description = "The command-line front end for SVA"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "sva-cli"
path = "src/main.rs"

[dependencies]
sva-analysis = { workspace = true }
sva-ast = { workspace = true }
sva-core = { workspace = true }
sva-engine = { workspace = true }
sva-formula = { workspace = true }
hound = "3.5.1"
