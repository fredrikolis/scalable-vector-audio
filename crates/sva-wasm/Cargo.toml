# Concern: declares the package, its cdylib/rlib targets and the crates the JS bindings compose | Non-concern: the deny edges barring anything from depending on it (.annotated-tree.toml) | IO: none
[package]
name = "sva-wasm"
description = "JS bindings: a composition a page fills node by node, rendered in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sva-ast = { workspace = true }
sva-core = { workspace = true }
sva-engine = { workspace = true }
js-sys = "0.3.105"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Only a build made with wasm threads (`+atomics`) carries the pool `startThreads` fills.
[target.'cfg(target_feature = "atomics")'.dependencies]
wasm-bindgen-rayon = { version = "1.3", features = ["no-bundler"] }
